# ===============================
# SERVER CONFIG
# ===============================
server.port=8080
spring.application.name=java-3tier-sample-app

# ===============================
# ACTUATOR (ALB HEALTH CHECKS)
# Health check URL: http://<ALB-DNS>/actuator/health
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ===============================
# DATABASE CONFIG (RDS PROXY)
# ===============================
spring.datasource.url=jdbc:mysql://<RDS-PROXY-ENDPOINT>:3306/appdb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=admin
spring.datasource.password=StrongPassword123

# ===============================
# JPA / HIBERNATE (Auto-create tables)
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ===============================
# HIKARI CONNECTION POOL 
# (Predictable DB usage, Safe scale-in / scale-out)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# REDIS CACHE (Reduce DB load)
# ===============================
spring.redis.host=<REDIS-ENDPOINT>
spring.redis.port=6379
spring.cache.type=redis

# ===============================
# GRACEFUL SHUTDOWN
# When ASG terminates an instance: App must finish requests
# DB connections must close cleanly
# ===============================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
